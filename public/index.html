<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>서고챗</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="reg" hidden>
  <form id="rf" autocomplete="off">
    <h1>서고챗</h1>
    <input id="nm" maxlength="12" placeholder="이름 (한글+숫자, 12자 이내)" aria-label="이름" autocomplete="nickname">
    <button id="go" class="pri" type="submit">시작</button>
    <p id="rs"></p>
  </form>
</div>

<div id="app" data-v="list" hidden>
  <aside>
    <div class="top"><b>서고챗</b><span class="net"><i id="nd" class="dot"></i><span id="nt"></span></span></div>
    <div class="me">
      <div class="mr"><div id="myn" class="nm"></div><button id="nameb" type="button">이름 수정</button><button id="lo" type="button">로그아웃</button></div>
      <div class="code">내 코드 <b id="myc" role="button" tabindex="0" title="숫자를 클릭하면 복사됩니다."></b><button id="addb" type="button">+ 친구 추가</button></div>
    </div>
    <div class="acts">
      <button id="roomb" type="button">방 만들기</button>
      <button id="joinb" type="button">방 추가</button>
      <button id="nb" type="button">알림 켜기</button>
    </div>
    <form id="addp" hidden autocomplete="off">
      <div class="row">
        <input id="ac" inputmode="numeric" maxlength="4" placeholder="친구 코드 4자리" aria-label="친구 코드">
        <button id="ago" class="pri" type="submit">요청</button>
      </div>
      <p id="ast"></p>
    </form>
    <div id="roomp" hidden>
      <div class="roomp-head"><strong>방 만들기</strong><button id="roomClose" type="button">닫기</button></div>
      <p class="room-guide">원하는 방식의 방을 선택하세요.</p>
      <section class="room-card">
        <div class="room-card-title">오픈채팅 만들기</div>
        <p>오픈채팅 목록에 공개됩니다. 다른 사용자도 목록에서 찾아 참가할 수 있습니다.</p>
        <form id="rmk" class="room-form" autocomplete="off">
          <input id="rn" maxlength="30" placeholder="오픈채팅방 이름" aria-label="오픈채팅방 이름">
          <button id="rmkb" class="pri" type="submit">오픈채팅 만들기</button>
        </form>
      </section>
      <section class="room-card">
        <div class="room-card-title">6자리 코드방 만들기</div>
        <p>방을 만든 뒤 발급되는 6자리 코드를 알려준 사람만 참가할 수 있습니다.</p>
        <form id="gmk" class="room-form" autocomplete="off">
          <input id="grn" maxlength="30" placeholder="코드방 이름" aria-label="코드방 이름">
          <button id="grmb" class="pri" type="submit">코드 발급 및 만들기</button>
        </form>
      </section>
      <p id="rst"></p>
    </div>
    <div id="joinp" hidden>
      <div class="roomp-head"><strong>방 추가</strong><button id="joinClose" type="button">닫기</button></div>
      <p class="room-guide">초대받은 6자리 방 코드를 입력하면 해당 방에 참가합니다.</p>
      <form id="cjn" class="room-form" autocomplete="off">
        <input id="rc" inputmode="numeric" maxlength="6" placeholder="6자리 방 코드" aria-label="방 코드">
        <button id="rcb" class="pri" type="submit">방 참가</button>
      </form>
      <p id="jst"></p>
    </div>
    <div id="rq" hidden>
      <h2>친구 요청</h2>
      <ul id="rql"></ul>
    </div>
    <div id="lists">
      <h2 id="fh">개인 DM</h2>
      <ul id="fl"></ul>
      <h2 id="rh" hidden>오픈채팅</h2>
      <ul id="rl"></ul>
      <h2 id="ch" hidden>참여 중인 코드방</h2>
      <ul id="cl"></ul>
    </div>
  </aside>

  <main>
    <div id="empty">개인 DM이나 오픈채팅을 선택하세요</div>
    <section id="chat" hidden>
      <header>
        <button id="bk" class="back" type="button" aria-label="목록">‹</button>
        <div class="hd"><div id="cn" class="nm"></div><div id="cs" class="st"></div></div>
        <div class="hb">
          <button id="rnm" type="button" hidden>방 이름 수정</button>
          <button id="pb" type="button" hidden>참여자</button>
          <button id="lv" type="button" hidden>나가기</button>
        </div>
      </header>
      <div id="pl" hidden></div>
      <div id="ms"></div>
      <div id="hint"></div>
      <div id="replying" hidden><span id="replyText"></span><button id="replyClear" type="button" aria-label="답글 취소">취소</button></div>
      <div id="mentionMenu" hidden></div>
      <form id="cf">
        <button id="at" type="button" aria-label="사진 및 GIF 첨부">사진/GIF</button>
        <input id="fi" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <textarea id="inp" rows="1" maxlength="2000" placeholder="메시지 입력" aria-label="메시지"></textarea>
        <button id="sd" class="pri" type="submit">전송</button>
      </form>
    </section>
  </main>
</div>

<div id="toast" hidden></div>
<div id="lb" hidden><img alt="사진"></div>

<script src="config.js"></script>
<script src="supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
