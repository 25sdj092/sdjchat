name: Apply SDJChat ZIP update

on:
  push:
    branches: [main]
    paths:
      - 'sdjchat-update.tar.xz.b64.*'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files from uploaded archive
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f sdjchat-update.tar.xz.b64.00.p0 ]]; then
            echo "Archive chunks are already removed."
            exit 0
          fi
          cat \
            sdjchat-update.tar.xz.b64.00.p0 \
            sdjchat-update.tar.xz.b64.00.p1 \
            sdjchat-update.tar.xz.b64.00.p2 \
            sdjchat-update.tar.xz.b64.00.p3 \
            sdjchat-update.tar.xz.b64.00.p4 \
            sdjchat-update.tar.xz.b64.00.p5 \
            sdjchat-update.tar.xz.b64.01 \
            sdjchat-update.tar.xz.b64.02 \
            sdjchat-update.tar.xz.b64.03 \
            sdjchat-update.tar.xz.b64.04 \
            sdjchat-update.tar.xz.b64.05 \
            sdjchat-update.tar.xz.b64.06 \
            sdjchat-update.tar.xz.b64.07.p0 \
            sdjchat-update.tar.xz.b64.07.p1 \
            sdjchat-update.tar.xz.b64.07.p2 \
            sdjchat-update.tar.xz.b64.07.p3 \
            sdjchat-update.tar.xz.b64.07.p4a \
            sdjchat-update.tar.xz.b64.07.p4b \
            sdjchat-update.tar.xz.b64.07.p5 \
            sdjchat-update.tar.xz.b64.07.p6 \
            sdjchat-update.tar.xz.b64.07.p7 \
            sdjchat-update.tar.xz.b64.08 \
            sdjchat-update.tar.xz.b64.09 \
            sdjchat-update.tar.xz.b64.10 | base64 --decode > /tmp/sdjchat-update.tar.xz
          xz -t /tmp/sdjchat-update.tar.xz
          mkdir -p /tmp/sdjchat-source
          tar -xJf /tmp/sdjchat-update.tar.xz -C /tmp/sdjchat-source
          test -f /tmp/sdjchat-source/public/app.js
          test -f /tmp/sdjchat-source/public/supabase.js
          test -f /tmp/sdjchat-source/supabase/schema.sql
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github -exec rm -rf {} +
          cp -a /tmp/sdjchat-source/. .
          rm -f sdjchat-update.tar.xz.b64.*
          git add -A
          if git diff --cached --quiet; then
            echo "No project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish SDJChat ZIP update"
          git push
